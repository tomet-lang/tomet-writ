name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build · Test · Lint · Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: tomet
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build twrit package
        run: nix build .#twrit

      - name: Run checks & tests
        run: nix develop --command cargo test --workspace

      - name: Check docs
        run: nix develop --command just docs-check
